# ========================================
# Nginx Configuration for PED Majevica
# ========================================
# Copy this file to /etc/nginx/sites-available/pedmajevica
#
# Setup:
#   sudo cp pedmajevica.nginx.conf /etc/nginx/sites-available/pedmajevica
#   sudo ln -s /etc/nginx/sites-available/pedmajevica /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo nginx -t
#   sudo systemctl restart nginx
#
# ========================================

# HTTP Server - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name pedmajevica.org www.pedmajevica.org;

    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pedmajevica.org www.pedmajevica.org;

    # SSL Configuration (Certbot will update these paths)
    ssl_certificate /etc/letsencrypt/live/pedmajevica.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pedmajevica.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' https: data:; connect-src 'self' https:;" always;

    # Logging
    access_log /var/log/nginx/pedmajevica-access.log;
    error_log /var/log/nginx/pedmajevica-error.log;

    # Root for static files
    root /var/www/ped-majevica/frontend;

    # Disable server tokens
    server_tokens off;

    # -----------------------------
    # Static Files - CSS
    # -----------------------------
    location /assets/css/ {
        alias /var/www/ped-majevica/frontend/assets/css/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # -----------------------------
    # Static Files - JS
    # -----------------------------
    location /js/ {
        alias /var/www/ped-majevica/frontend/js/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # -----------------------------
    # Static Files - Images
    # -----------------------------
    location /assets/images/ {
        alias /var/www/ped-majevica/frontend/assets/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # -----------------------------
    # Static Files - Other Assets
    # -----------------------------
    location /assets/ {
        alias /var/www/ped-majevica/frontend/assets/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # -----------------------------
    # API Proxy to Gunicorn
    # -----------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect off;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;

        # Size limits
        client_max_body_size 16M;
    }

    # -----------------------------
    # Admin Routes Proxy
    # -----------------------------
    location /admin {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------
    # Login Route Proxy
    # -----------------------------
    location /login {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------
    # Upload Files Proxy
    # -----------------------------
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------
    # Main Routes (HTML pages via Flask)
    # -----------------------------
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSockets support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # -----------------------------
    # Block Hidden Files
    # -----------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # -----------------------------
    # Block Sensitive Files
    # -----------------------------
    location ~* \.(env|git|sql|db|sqlite|py|pyc)$ {
        deny all;
        return 404;
    }

    # -----------------------------
    # Block Backup Files
    # -----------------------------
    location ~* \.(bak|backup|old|orig|save)$ {
        deny all;
        return 404;
    }
}
