# =====================================================
# Pytest Configuration for PED Majevica 1988
# =====================================================

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    slow: marks tests as slow
    integration: marks integration tests
    api: marks API tests
    frontend: marks frontend tests
    auth: marks authentication tests
    admin: marks admin panel tests
