# Nginx Configuration for pedmajevica.org

# Redirect www to non-www
server {
    listen 80;
    listen [::]:80;
    server_name www.pedmajevica.org;
    return 301 $scheme://pedmajevica.org$request_uri;
}

# Main server block
server {
    listen 80;
    listen [::]:80;
    server_name pedmajevica.org;

    # Logging
    access_log /var/log/nginx/pedmajevica-access.log;
    error_log /var/log/nginx/pedmajevica-error.log;

    # Max upload size
    client_max_body_size 20M;

    # Frontend static files
    location /assets/ {
        alias /var/www/pedmajevica/frontend/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /js/ {
        alias /var/www/pedmajevica/frontend/js/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Frontend pages
    location / {
        alias /var/www/pedmajevica/frontend/pages/;
        try_files $uri $uri/ /index.html;
        expires 1h;
    }

    # Backend API
    location /api/ {
        proxy_pass http://unix:/var/www/pedmajevica/pedmajevica.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
    }

    # Admin routes
    location /admin {
        proxy_pass http://unix:/var/www/pedmajevica/pedmajevica.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login {
        proxy_pass http://unix:/var/www/pedmajevica/pedmajevica.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
