# PED Majevica - nginx (pocetna HTTP konfiguracija)
# HTTPS dodaje certbot nakon sto domena pokazuje na server:
#   sudo certbot --nginx -d pedmajevica.org -d www.pedmajevica.org
# Certbot sam dopisuje ssl_certificate linije i HTTP->HTTPS redirect.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name pedmajevica.org www.pedmajevica.org _;

    server_tokens off;
    client_max_body_size 16M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/pedmajevica-access.log;
    error_log  /var/log/nginx/pedmajevica-error.log;

    location /assets/ {
        alias /var/www/ped-majevica/frontend/assets/;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /js/ {
        alias /var/www/ped-majevica/frontend/js/;
        expires 5m;
        add_header Cache-Control "public";
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
