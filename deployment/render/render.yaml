# Render.com Deployment Configuration
# https://render.com/docs/yaml-spec

services:
  # Backend API (Flask)
  - type: web
    name: ped-majevica-backend
    env: python
    region: frankfurt  # Closest to Bosnia and Herzegovina
    buildCommand: |
      cd backend
      pip install -r requirements.txt
      npm install
      npm run build
    startCommand: |
      cd backend
      flask db upgrade
      gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 wsgi:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ped-majevica-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: LOG_LEVEL
        value: INFO

  # Static Frontend (served via Flask in this config)
  # Alternative: Deploy frontend separately as static site

databases:
  # PostgreSQL Database
  - name: ped-majevica-db
    databaseName: ped_majevica
    region: frankfurt
    plan: free  # Free tier: 90 days, then $7/month
    postgresMajorVersion: 15
